name: discover
on:
  workflow_dispatch:
  push:
    paths: ["scripts/discover.py", ".github/workflows/discover.yml"]
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/discover.py
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data; git diff --cached --quiet || (git commit -m "discovery" && git pull --rebase -q && git push)
