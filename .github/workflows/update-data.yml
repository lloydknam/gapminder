name: update-data
on:
  workflow_dispatch:
  push:
    paths: [indicators.json, scripts/fetch_data.py]
  schedule: [{cron: "0 3 1 * *"}]
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_data.py
        timeout-minutes: 90
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data; git diff --cached --quiet || (git commit -m "update data" && git pull --rebase -q && git push)
