</style></head><body><header class="hd"><img src="assets/clerk.jpg" alt="클사무관"><div><b>클사무관의 <em>갭마인더</em></b><span>OECD 38개국 + 중국 · 지표별 시간 변화</span></div><button id="mbtn">☰ 메뉴<small>분류·지표 선택</small></button></header>

<div class="leg" id="leg"></div><div class="src">출처: OECD · World Bank (1인당 GDP·인구) · 버블 위에 마우스를 올리면 값이 보입니다<br>키보드: ← 왼쪽 방향키 = 1년 전으로 이동 · → 오른쪽 방향키 = 1년 뒤로 이동 · 스페이스바 = 재생/정지 · 마지막 연도에서 멈추며, 재생 버튼을 다시 누르면 처음부터 재생됩니다</div>

<script>
const COL={"유럽":"#9cc3f5","아시아":"#f7a3b5","북미":"#9edcb8","중남미":"#fbcf8f","오세아니아":"#c9b0ec"};
let M={l:96,r:20,t:16,b:62},W=960,H=640,MOB=false;

const $=id=>document.getElementById(id),svg=$("chart");

(async()=>{
 [CAT,CT]=await Promise.all([j("indicators.json"),j("countries.json")]);try{const rd=await j("data/ready.json");CAT.categories.forEach(c=>c.indicators.forEach(n=>{if(n.status!=="probe"&&!rd.includes(n.id))n.status="todo"}))}catch(e){};CAT.categories=CAT.categories.filter(c=>c.indicators.some(n=>n.status!=="probe"))
 $("play").onclick=toggle;$("mbtn").onclick=()=>$("nav").classList.toggle("open");
 $("yr").oninput=e=>{stop();cur=+e.target.value;draw()};
 $("leg").innerHTML=Object.entries(COL).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join("");
 (()=>{const mix=(h,t,a)=>{const n=parseInt(h.slice(1),16),r=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a));return`rgb(${r})`};
  $("defs").innerHTML=Object.values(COL).map((c,i)=>`<radialGradient id="g${i}" cx=".38" cy=".32" fx=".32" fy=".26" r=".78"><stop offset="0" stop-color="${mix(c,255,.75)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${mix(c,0,.28)}"/></radialGradient>`).join("")+'<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="1.5" dy="3" stdDeviation="2.2" flood-color="#1d2a44" flood-opacity=".28"/></filter>'})();
 buildNav();$("nclose").onclick=e=>{e.stopPropagation();$("nav").classList.remove("open")};const m=(location.hash.match(/(\d+)-(\d+)/)||[0,0,0]);pick(+m[1],+m[2]);
})();

 $("nav").onclick=e=>{const b=e.target.closest("button");if(b){pick(+b.dataset.c,+b.dataset.i);$("nav").classList.remove("open");return}
  const h=e.target.closest("h3");if(h)showCat(+h.dataset.c)}}

 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",+b.dataset.c===c&&+b.dataset.i===i));

 let y;if(ind.wb)y=wb(ind.wb);else{const m=(ind.flow||"").split(",");y="OECD · "+((m[1]||"").split("@")[1]||m[1]||"")+(m[2]?" (v"+m[2]+")":"")}
 $("srcl").innerHTML="출처 — 지표: "+y+" · 1인당 GDP: "+wb(CAT.x.wb)+" · 인구: "+wb(CAT.size.wb)}
async function load(){stop();sel=null;$("tip").style.display="none";
 ind=CAT.categories[ci].indicators[ii];srcLine();
 const msg=$("msg");
 if(ind.status!=="ready"){svg.style.display="none";msg.hidden=false;msg.textContent="이 지표는 데이터 준비 중입니다.";return}
 try{[X,P,Y]=await Promise.all([j(`data/${CAT.x.id}.json`),j(`data/${CAT.size.id}.json`),j(`data/${ind.id}.json`)])}
 catch(e){svg.style.display="none";msg.hidden=false;msg.textContent="data/ 폴더에 데이터가 없습니다. GitHub Actions의 update-data를 먼저 실행하세요.";return}
 msg.hidden=true;svg.style.display="block";
 const ys=new Set();Object.values(Y).forEach(o=>Object.keys(o).forEach(y=>ys.add(+y)));
 years=[...ys].sort((a,b)=>a-b);const ky=Object.keys(Y.KOR||{}).map(Number);if(ky.length){const km=Math.max(...ky);years=years.filter(y=>y<=km)}const s=$("yr");s.min=years[0];s.max=years.at(-1);s.step=1;const cnt={};Object.values(Y).forEach(o=>Object.keys(o).forEach(y=>cnt[y]=(cnt[y]||0)+1));const mx=Math.max(...Object.values(cnt));
 s.value=cur=[...years].reverse().find(y=>cnt[y]>=mx*.8)||years.at(-1);draw();
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches){cur=years[0];s.value=cur;draw();toggle()}}
function val(S,c,y){const o=S[c];if(!o)return null;if(o[y]!=null)return o[y];

 for(const t of k){if(t<y)a=t;else if(t>y){b=t;break}}

 const n=5;for(let i=0;i<=n;i++){const v=y0+(y1-y0)*i/n;h+=`<line class="grid" x1="${M.l}" x2="${W-M.r}" y1="${sy(v)}" y2="${sy(v)}"/><text class="ax" x="${M.l-(MOB?2:3)}" y="${sy(v)+4}" text-anchor="end">${v.toFixed(v<10?1:0)}</text>`}

 pts.sort((a,b)=>(a.c==="KOR")-(b.c==="KOR")||(a.c===sel)-(b.c===sel)||b.p-a.p).forEach(d=>{const f=sel===d.c;
  h+=`<circle data-c="${d.c}" class="${f?"sel":""}" cx="${sx(d.x)}" cy="${sy(d.y)}" r="${sr(d.p)}" fill="url(#g${Object.keys(COL).indexOf(CT[d.c][1])})"/>`;
  });
 const placed=[],ov=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 const order=[...pts].sort((a,b)=>(b.c==="KOR")-(a.c==="KOR")||(b.c===sel)-(a.c===sel)||b.p-a.p);
 order.forEach(d=>{const cx=sx(d.x),cy=sy(d.y),r=sr(d.p),nm=CT[d.c][0],fs=MOB?(d.c==="KOR"||d.c===sel?13:10):(d.c==="KOR"||d.c===sel?23:18),w=nm.length*fs*1.02+4,hh=fs+2;
  const cands=[];for(const k of [0,1,2,3,4]){const o=k*20;cands.push([cx-w/2,cy-r-hh-1-o],[cx-w/2,cy+r+2+o],[cx+r+3+o,cy-hh/2],[cx-r-3-w-o,cy-hh/2],[cx+r+3+o,cy-hh-o/2],[cx-r-3-w-o,cy-hh-o/2],[cx+r+3+o,cy+o/2],[cx-r-3-w-o,cy+o/2])}
  let best=null,bs=1e9;
  for(const [x,y] of cands){const b={x:Math.max(M.l,Math.min(W-M.r-w,x)),y:Math.max(2,Math.min(H-M.b-hh,y)),w,h:hh};const sc=placed.filter(q=>ov(b,q)).length;if(sc<bs){bs=sc;best=b}if(!sc)break}
  const lx=best.x+w/2,ly=best.y+hh/2;if(Math.hypot(lx-cx,ly-cy)>r+hh+14)h+=`<line x1="${cx}" y1="${cy}" x2="${lx}" y2="${ly}" stroke="#a9b5c0" stroke-width="1"/>`;
  placed.push(best);
  h+=`<text class="lab" style="font-size:${fs}px" x="${best.x+w/2}" y="${best.y+hh-4}" text-anchor="middle">${nm}</text>`});
 $("main").innerHTML=h;const kp=pts.find(q=>q.c==="KOR");["kr1","kr2"].forEach(i=>{const e=$(i);if(kp){e.setAttribute("cx",sx(kp.x));e.setAttribute("cy",sy(kp.y));e.setAttribute("r",sr(kp.p));e.style.display=""}else e.style.display="none"});
 $("big").firstChild.textContent="";$("bigsub").textContent="단위: "+ind.unit;
 const avg=pts.reduce((a,d)=>a+d.y,0)/pts.length;
 $("l1").textContent=GN[GRP]+" 단순평균 ("+pts.length+"개국)";$("v1").textContent=fv(avg)+" "+ind.unit;
 const ko=[...pts].sort((a,b)=>b.y-a.y).findIndex(d=>d.c==="KOR"),kd=pts.find(d=>d.c==="KOR");
 $("l2").textContent="한국"+(ko>=0?" · "+(ko+1)+(GRP==="all"?"위(높은 순)":"위("+GN[GRP]+" 중)"):"");$("v2").textContent=kd?fv(kd.y)+" "+ind.unit:"—";
 $("main").querySelectorAll("circle").forEach(el=>{const d=pts.find(q=>q.c===el.dataset.c);
  el.onmousemove=e=>{const t=$("tip");window._tipc=d.c;
   t.innerHTML=`<b>${CT[d.c][0]}</b> ${cur}<br>${ind.name}: ${fv(d.y)} ${ind.unit}<br>1인당 GDP: ${Math.round(d.x).toLocaleString()}<br>인구: ${Math.round(d.p).toLocaleString()}`;
   t.style.display="block";const w=t.offsetWidth,h=t.offsetHeight;let lx=e.clientX+12,ly=e.clientY+12;if(lx+w>innerWidth-6)lx=Math.max(6,e.clientX-w-12);if(ly+h>innerHeight-6)ly=Math.max(6,e.clientY-h-12);t.style.left=lx+"px";t.style.top=ly+"px";
   clearTimeout(window._tipt);if(matchMedia("(pointer:coarse)").matches)window._tipt=setTimeout(()=>{t.style.display="none"},2200)};
  el.onmouseleave=()=>$("tip").style.display="none";
  el.onclick=()=>{sel=sel===d.c?null:d.c;draw()}});
 if(window._tipc&&!pts.some(q=>q.c===window._tipc))$("tip").style.display="none"}
const fv=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString():v.toFixed(1);
document.addEventListener("click",e=>{if(e.target.closest("button,#yr"))$("tip").style.display="none"},true);
let GRP="all";const G7=["USA","JPN","DEU","GBR","FRA","ITA","CAN","KOR","CHN"],GN={all:"전체",oecd:"OECD",big:"주요국",g7:"G7+한중"};
function inG(c){if(GRP==="all")return true;if(GRP==="oecd")return c!=="CHN";if(GRP==="g7")return G7.includes(c);const q=P&&P[c];if(!q)return false;const ks=Object.keys(q);return ks.length&&q[ks.sort().pop()]>=1e7}
$("grp").onclick=e=>{const b=e.target.closest("button");if(!b)return;GRP=b.dataset.g;$("tip").style.display="none";document.querySelectorAll("#grp button").forEach(x=>x.classList.toggle("on",x===b));if(Y)draw()};

let wait=false,fc=0;const MS=412;
function step(){const L=years.at(-1);if(fc>=L){cur=L;stop();return}
 fc=Math.min(L,fc+50/MS*spd);cur=Math.floor(fc+1e-9);$("yr").value=cur;draw();if(fc>=L){cur=L;$("yr").value=cur;stop();draw()}}
function go(d){if(!years.length)return;stop();cur=Math.max(years[0],Math.min(years.at(-1),cur+d));$("yr").value=cur;draw()}
