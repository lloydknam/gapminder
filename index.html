<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>클사무관의 갭마인더</title>
<link rel="icon" href="assets/brand/favicon.svg"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<style>
:root{--bg:#eaf6f3;--fg:#1d2a3a;--mut:#4f5f6f;--line:#d9ece7;--card:#fff;--teal:#2bb8a0;--deep:#0f7a68;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.5 -apple-system,"Noto Sans KR","Pretendard",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:6px solid var(--teal);border-radius:36px;padding:22px 28px 20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
#big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
#big small{display:block;font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
.ttl{text-align:right}.ttl h1{font-size:34px;margin:0;font-weight:800}.sub{color:var(--mut);font-size:17px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
select{font:inherit;font-weight:600;padding:10px 38px 10px 18px;border:2px solid var(--teal);border-radius:999px;background:#f3fbf9;color:var(--fg)}
.box{border:2px dashed #a9ddd2;border-radius:12px;margin-top:6px}
#chart{width:100%;height:auto;display:block}
.ax{fill:var(--mut);font-size:17px}.grid{stroke:var(--line);stroke-width:1.5}
circle{stroke:#fff;stroke-width:2;cursor:pointer;fill-opacity:.92}circle.sel{stroke:var(--deep);stroke-width:4}
.lab{font-size:19px;font-weight:700;fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px}
.stats{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
.stats .l{color:var(--mut);font-size:17px;font-weight:600}.stats .v{font-size:46px;font-weight:800;line-height:1.1}.v.t{color:var(--deep)}.r{text-align:right}
.row{display:flex;align-items:center;gap:18px;margin-top:12px}
#play{width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:26px;cursor:pointer;flex:none}
input[type=range]{flex:1;height:12px;accent-color:var(--teal)}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:18px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-2px}
#tip{position:fixed;pointer-events:none;background:#fff;border:2px solid var(--teal);border-radius:14px;padding:10px 14px;font-size:18px;display:none}
#msg{color:var(--mut);padding:60px 10px;text-align:center}
.src{font-size:15px;color:var(--mut);margin-top:10px}
footer{margin-top:18px;font-size:15px;color:var(--mut);text-align:center}footer a{color:inherit}


.hd{background:#fff;border-bottom:2px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.hd img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--teal)}
.hd b{font-size:30px;font-weight:800;display:block;line-height:1.15}.hd b em{font-style:normal;color:var(--deep)}.hd span{color:var(--mut);font-size:16px}
#mbtn{display:none;margin-left:auto;font:inherit;font-weight:700;padding:10px 16px;border:2px solid var(--teal);border-radius:999px;background:#fff;color:var(--deep)}
.shell{display:flex;gap:22px;max-width:1500px;margin:0 auto;padding:20px 16px;align-items:flex-start}
#nav{width:310px;flex:none;position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;background:#fff;border:3px solid var(--teal);border-radius:24px;padding:12px 10px}
#nav h3{margin:14px 8px 6px;font-size:21px;font-weight:800;color:var(--deep)}#nav h3:first-child{margin-top:4px}
#nav button{display:block;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:600;padding:9px 14px;margin:2px 0;border:0;border-radius:12px;background:transparent;color:var(--fg);cursor:pointer}
#nav button:hover{background:#e3f5f1}
#nav button.on{background:var(--teal);color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(43,184,160,.4)}
#nav button.todo{color:#8a97a5;font-weight:500}#nav button.todo.on{color:#fff}
#nav button i{font-style:normal;font-size:13px;margin-left:6px;background:#eef1f4;color:#6b7886;border-radius:999px;padding:1px 8px}
main{flex:1;min-width:0}.wrap{max-width:none;padding:0}
.chip{display:inline-block;background:#dff4ef;color:var(--deep);font-weight:800;font-size:17px;border-radius:999px;padding:3px 14px;margin-bottom:4px}
.ttl h1{font-size:38px}
@media(max-width:900px){#mbtn{display:block}.hd b{font-size:22px}.hd span{display:none}.hd img{width:44px;height:44px}.shell{display:block;padding:12px}#nav{display:none;position:fixed;inset:70px 12px 12px 12px;width:auto;max-height:none;z-index:9;top:70px}#nav.open{display:block}}
@media(max-width:640px){.ax{font-size:12px}.lab{stroke-width:3px}.hd{padding:10px 12px;gap:10px}.hd b{font-size:17px;white-space:nowrap}.hd{gap:8px}.hd img{width:40px;height:40px;border-width:2px}.hd>div{min-width:0}#mbtn{white-space:nowrap;padding:6px 10px;font-size:14px;flex:none}.ttl{text-align:left;width:100%}.ttl h1{font-size:26px}.sub{font-size:14px}.chip{font-size:14px}#big{font-size:46px}#big small{font-size:15px}.stats{flex-wrap:nowrap}.stats>div{flex:1;min-width:0}.stats .r{text-align:right}.stats .l{font-size:14px}.stats .v{font-size:26px}.leg{font-size:15px;gap:10px 14px}#play{width:52px;height:52px;font-size:22px}.src{font-size:13px}select{font-size:16px}body{font-size:17px;background:#fff}.shell{padding:8px 6px}.card{border:0;border-radius:0;padding:4px 4px 0}.box{border:0;margin-top:2px}.wrap{padding:0}}
.kr{stroke:#ff4f7b;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:kp 1.4s ease-out infinite}.kr.k2{animation-delay:.7s}@keyframes kp{0%{transform:scale(1);opacity:.95}100%{transform:scale(2.3);opacity:0}}@media(prefers-reduced-motion:reduce){.kr{animation:none;opacity:.6}}
#spd{display:flex;gap:4px;flex:none}#spd button{font:inherit;font-size:16px;font-weight:700;padding:6px 12px;border:2px solid var(--teal);border-radius:999px;background:#fff;color:var(--deep);cursor:pointer}#spd button.on{background:var(--teal);color:#fff}@media(max-width:640px){.row{flex-wrap:wrap;gap:10px}#yr{order:3;flex:1 0 100%}#spd{margin-left:auto}#spd button{font-size:14px;padding:5px 10px}}
@media(max-width:640px){html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}.hd{position:static}.shell{padding:4px 4px}#big,.chip,.sub,.src{display:none}.top{margin:0}.ttl{text-align:left}.ttl h1{font-size:21px;margin:4px 2px 2px}.box{margin-top:0}.stats{margin-top:4px}.stats .l{font-size:13px}.stats .v{font-size:22px}.row{margin-top:6px;gap:8px;flex-wrap:wrap}#play{width:44px;height:44px;font-size:18px}#spd{margin-left:auto;gap:3px}#spd button{font-size:13px;padding:4px 8px;border-width:1.5px}#yr{order:3;flex:1 0 100%;height:8px;margin:2px 0}.leg{font-size:13px;gap:6px 12px;margin-top:4px}.leg i{width:11px;height:11px;margin-right:4px}footer{margin-top:8px}footer img{height:36px;width:auto}}
</style></head><body><header class="hd"><img src="assets/clerk.jpg" alt="클사무관"><div><b>클사무관의 <em>갭마인더</em></b><span>OECD 38개국 · 지표별 시간 변화</span></div><button id="mbtn">☰ 메뉴</button></header>
<div class="shell"><nav id="nav"></nav><main><div class="wrap"><div class="card">
<div class="top"><div id="big">—<small id="bigsub"></small></div><div class="ttl"><div class="chip" id="chip"></div><h1 id="h1"></h1><div class="sub">X: 1인당 GDP(PPP) · 크기: 인구 · 색: 대륙</div></div></div>
<div class="box"><div id="msg" hidden></div><svg id="chart" viewBox="0 0 960 640"><g id="main"></g><g id="fx" pointer-events="none"><circle class="kr" id="kr1" r="10" fill="none"/><circle class="kr k2" id="kr2" r="10" fill="none"/></g></svg></div>
<div class="stats"><div><div class="l" id="l1"></div><div class="v" id="v1">—</div></div><div class="r"><div class="l" id="l2"></div><div class="v t" id="v2">—</div></div></div>
<div class="row"><button id="play">▶</button><input id="yr" type="range"><div id="spd" role="group" aria-label="재생 속도"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div></div>
<div class="leg" id="leg"></div><div class="src">출처: OECD · World Bank (1인당 GDP·인구) · 선·점 위에 마우스를 올리면 값이 보입니다</div>
</div><footer><a href="https://github.com/lloydknam" target="_blank" rel="noopener"><img src="assets/brand/lockup-light.svg" alt="Lloyd's balcony lab · with claude · GitHub(@lloydknam)" height="48"></a></footer></div></main></div><div id="tip"></div>
<script>
const COL={"유럽":"#9cc3f5","아시아":"#f7a3b5","북미":"#9edcb8","중남미":"#fbcf8f","오세아니아":"#c9b0ec"};
let M={l:96,r:20,t:16,b:62},W=960,H=640,MOB=false;
let CAT,CT,X,P,Y,ind,years=[],cur,sel=null,timer=null;
const $=id=>document.getElementById(id),svg=$("chart");
const j=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
(async()=>{
 [CAT,CT]=await Promise.all([j("indicators.json"),j("countries.json")]);
 $("play").onclick=toggle;$("mbtn").onclick=()=>$("nav").classList.toggle("open");
 $("yr").oninput=e=>{stop();cur=+e.target.value;draw()};
 $("leg").innerHTML=Object.entries(COL).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join("");
 buildNav();const m=(location.hash.match(/(\d+)-(\d+)/)||[0,0,0]);pick(+m[1],+m[2]);
})();
let ci=0,ii=0;
function buildNav(){$("nav").innerHTML=CAT.categories.map((c,i)=>`<h3>${i+1}. ${c.name}</h3>`+c.indicators.map((n,k)=>`<button data-c="${i}" data-i="${k}" class="${n.status==="ready"?"":"todo"}">${n.name}${n.status==="ready"?"":"<i>준비 중</i>"}</button>`).join("")).join("");
 $("nav").onclick=e=>{const b=e.target.closest("button");if(b){pick(+b.dataset.c,+b.dataset.i);$("nav").classList.remove("open")}}}
function pick(c,i){ci=c;ii=i;location.hash=c+"-"+i;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",+b.dataset.c===c&&+b.dataset.i===i));
 $("chip").textContent=(c+1)+". "+CAT.categories[c].name;$("h1").textContent=CAT.categories[c].indicators[i].name;load()}
async function load(){stop();sel=null;
 ind=CAT.categories[ci].indicators[ii];
 const msg=$("msg");
 if(ind.status!=="ready"){svg.style.display="none";msg.hidden=false;msg.textContent="이 지표는 데이터 준비 중입니다.";return}
 try{[X,P,Y]=await Promise.all([j(`data/${CAT.x.id}.json`),j(`data/${CAT.size.id}.json`),j(`data/${ind.id}.json`)])}
 catch(e){svg.style.display="none";msg.hidden=false;msg.textContent="data/ 폴더에 데이터가 없습니다. GitHub Actions의 update-data를 먼저 실행하세요.";return}
 msg.hidden=true;svg.style.display="block";
 const ys=new Set();Object.values(Y).forEach(o=>Object.keys(o).forEach(y=>ys.add(+y)));
 years=[...ys].sort((a,b)=>a-b);const s=$("yr");s.min=years[0];s.max=years.at(-1);s.step=1;const cnt={};Object.values(Y).forEach(o=>Object.keys(o).forEach(y=>cnt[y]=(cnt[y]||0)+1));const mx=Math.max(...Object.values(cnt));
 s.value=cur=[...years].reverse().find(y=>cnt[y]>=mx*.8)||years.at(-1);draw()}
function val(S,c,y){const o=S[c];if(!o)return null;if(o[y]!=null)return o[y];
 const k=Object.keys(o).map(Number).sort((a,b)=>a-b);let a=null,b=null;
 for(const t of k){if(t<y)a=t;else if(t>y){b=t;break}}
 if(a==null||b==null||y-a>5||b-y>5)return null;return o[a]+(o[b]-o[a])*(y-a)/(b-a)}
function draw(){
 const bw=svg.parentElement.clientWidth||960;MOB=bw<640;
 W=MOB?bw:960;H=MOB?Math.round(Math.min(bw*1.4,Math.max(bw*.85,innerHeight-330))):640;M=MOB?{l:40,r:8,t:8,b:36}:{l:78,r:20,t:16,b:50};
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 const pts=[];let xs=[],ys=[];
 for(const c of Object.keys(CT)){const x=val(X,c,cur),p=val(P,c,cur),y=val(Y,c,cur);
  if(x&&p&&y!=null)pts.push({c,x,p,y});}
 const allY=[];for(const c in Y)for(const k in Y[c])allY.push(Y[c][k]);
 const allX=[];for(const c in X)for(const k in X[c])allX.push(X[c][k]);
 let y0=Math.min(...allY),y1=Math.max(...allY);const pad=(y1-y0)*.05;y0-=pad;y1+=pad;
 const x0=Math.min(...allX)*.9,x1=Math.max(...allX)*1.1;
 const sx=v=>M.l+(Math.log(v)-Math.log(x0))/(Math.log(x1)-Math.log(x0))*(W-M.l-M.r);
 const sy=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
 const pm=Math.max(...Object.values(P).flatMap(o=>Object.values(o)));
 const sr=p=>MOB?2.5+Math.sqrt(p/pm)*22:3+Math.sqrt(p/pm)*38;
 let h=`<text x="${W-M.r-8}" y="${H-M.b-12}" text-anchor="end" style="font-size:${MOB?96:170}px;font-weight:800;fill:#bfe9df;opacity:.85;pointer-events:none">${cur}</text>`;
 const xt=[10000,20000,50000,100000].filter(v=>v>=x0&&v<=x1);
 xt.forEach(v=>h+=`<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${M.t}" y2="${H-M.b}"/><text class="ax" x="${sx(v)}" y="${H-M.b+(MOB?15:20)}" text-anchor="middle">${v.toLocaleString()}</text>`);
 const n=5;for(let i=0;i<=n;i++){const v=y0+(y1-y0)*i/n;h+=`<line class="grid" x1="${M.l}" x2="${W-M.r}" y1="${sy(v)}" y2="${sy(v)}"/><text class="ax" x="${M.l-5}" y="${sy(v)+4}" text-anchor="end">${v.toFixed(v<10?1:0)}</text>`}
 h+=`<text class="ax" x="${W/2}" y="${H-(MOB?3:6)}" text-anchor="middle">${CAT.x.name} (로그)</text><text class="ax" x="${MOB?9:14}" y="${H/2}" transform="rotate(-90 ${MOB?9:14} ${H/2})" text-anchor="middle">${ind.name} (${ind.unit})</text>`;

 pts.sort((a,b)=>b.p-a.p).forEach(d=>{const f=sel===d.c;
  h+=`<circle data-c="${d.c}" class="${f?"sel":""}" cx="${sx(d.x)}" cy="${sy(d.y)}" r="${sr(d.p)}" fill="${COL[CT[d.c][1]]}"/>`;
  });
 const placed=[],ov=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 const order=[...pts].sort((a,b)=>(b.c==="KOR")-(a.c==="KOR")||(b.c===sel)-(a.c===sel)||b.p-a.p);
 order.forEach(d=>{const cx=sx(d.x),cy=sy(d.y),r=sr(d.p),nm=CT[d.c][0],fs=MOB?(d.c==="KOR"||d.c===sel?15:12):(d.c==="KOR"||d.c===sel?20:16),w=nm.length*fs*1.02+4,hh=fs+2;
  const cands=[];for(const k of [0,1,2,3,4]){const o=k*20;cands.push([cx-w/2,cy-r-hh-1-o],[cx-w/2,cy+r+2+o],[cx+r+3+o,cy-hh/2],[cx-r-3-w-o,cy-hh/2],[cx+r+3+o,cy-hh-o/2],[cx-r-3-w-o,cy-hh-o/2],[cx+r+3+o,cy+o/2],[cx-r-3-w-o,cy+o/2])}
  let best=null,bs=1e9;
  for(const [x,y] of cands){const b={x:Math.max(M.l,Math.min(W-M.r-w,x)),y:Math.max(2,Math.min(H-M.b-hh,y)),w,h:hh};const sc=placed.filter(q=>ov(b,q)).length;if(sc<bs){bs=sc;best=b}if(!sc)break}
  const lx=best.x+w/2,ly=best.y+hh/2;if(Math.hypot(lx-cx,ly-cy)>r+hh+14)h+=`<line x1="${cx}" y1="${cy}" x2="${lx}" y2="${ly}" stroke="#a9b5c0" stroke-width="1"/>`;
  placed.push(best);
  h+=`<text class="lab" style="font-size:${fs}px" x="${best.x+w/2}" y="${best.y+hh-4}" text-anchor="middle">${nm}</text>`});
 $("main").innerHTML=h;const kp=pts.find(q=>q.c==="KOR");["kr1","kr2"].forEach(i=>{const e=$(i);if(kp){e.setAttribute("cx",sx(kp.x));e.setAttribute("cy",sy(kp.y));e.setAttribute("r",sr(kp.p));e.style.display=""}else e.style.display="none"});
 $("big").firstChild.textContent="";$("bigsub").textContent="단위: "+ind.unit;
 const avg=pts.reduce((a,d)=>a+d.y,0)/pts.length;
 $("l1").textContent="OECD 단순평균 ("+pts.length+"개국)";$("v1").textContent=avg.toFixed(1)+" "+ind.unit;
 const ko=[...pts].sort((a,b)=>b.y-a.y).findIndex(d=>d.c==="KOR"),kd=pts.find(d=>d.c==="KOR");
 $("l2").textContent="한국"+(ko>=0?" · "+(ko+1)+"위(높은 순)":"");$("v2").textContent=kd?kd.y.toFixed(1)+" "+ind.unit:"—";
 $("main").querySelectorAll("circle").forEach(el=>{const d=pts.find(q=>q.c===el.dataset.c);
  el.onmousemove=e=>{const t=$("tip");t.style.display="block";t.style.left=e.clientX+12+"px";t.style.top=e.clientY+12+"px";
   t.innerHTML=`<b>${CT[d.c][0]}</b> ${cur}<br>${ind.name}: ${d.y.toFixed(1)} ${ind.unit}<br>1인당 GDP: ${Math.round(d.x).toLocaleString()}<br>인구: ${Math.round(d.p).toLocaleString()}`};
  el.onmouseleave=()=>$("tip").style.display="none";
  el.onclick=()=>{sel=sel===d.c?null:d.c;draw()}})}
let spd=1;
$("spd").onclick=e=>{const b=e.target.closest("button");if(!b)return;spd=+b.dataset.s;document.querySelectorAll("#spd button").forEach(x=>x.classList.toggle("on",x===b));if(timer){clearInterval(timer);timer=setInterval(step,350/spd)}};
function step(){if(cur>=years.at(-1))return stop();cur++;$("yr").value=cur;draw()}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶"}
function toggle(){if(timer)return stop();if(cur>=years.at(-1))cur=years[0];$("play").textContent="❚❚";
 timer=setInterval(step,350/spd)}
addEventListener("resize",()=>{if(Y&&ind&&ind.status==="ready")draw()});
</script></body></html>
